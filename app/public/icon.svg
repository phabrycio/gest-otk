<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0d3b2d"/>
      <stop offset="100%" stop-color="#051a12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle amber glow -->
  <circle cx="256" cy="220" r="200" fill="url(#glow)"/>
  <!-- Serif "E" letter — amber -->
  <text
    x="256"
    y="330"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="290"
    font-weight="700"
    fill="#d97706"
    letter-spacing="-8"
  >E</text>
  <!-- "360" tagline — white -->
  <text
    x="256"
    y="428"
    text-anchor="middle"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="72"
    font-weight="700"
    fill="#ffffff"
    opacity="0.85"
    letter-spacing="6"
  >360</text>
  <!-- Thin amber underline accent -->
  <rect x="176" y="438" width="160" height="3" rx="2" fill="#d97706" opacity="0.6"/>
</svg>
